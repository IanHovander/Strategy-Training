<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9a0000">
<title>FRC Strategy Lab</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<!-- The questions, points, screens and explorers come from games/frc-strategy/, the same files the team game uses.
     The explorer's look is the game's stylesheet too, so the two always match. -->
<link rel="stylesheet" href="games/frc-strategy/style.css">
<style>
/* The Game Night "arena" look: red sunburst, white sticker cards with black outlines and hard shadows,
   Teko for headings and numbers, Roboto for sentences. Only the Iron Panthers brand colors. */
@font-face{font-family:"Teko";src:url("fonts/teko.woff2") format("woff2");font-weight:300 600;font-display:swap}
@font-face{font-family:"Roboto";src:url("fonts/roboto.woff2") format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"Roboto";src:url("fonts/roboto-italic.woff2") format("woff2");font-weight:300 400;font-style:italic;font-display:swap}
:root{--red:#9a0000;--red-hi:#c80f14;--grey:#cccccc;--black:#1a1a1a;--off-black:#333333;--white:#ffffff;--ink:var(--black);--muted:#555555;--outline:.22rem;--drop:.35rem .42rem 0 var(--black);--display:Teko,Roboto,Arial,sans-serif;--font:Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{background:var(--red)}
body{min-height:100vh;color:var(--white);font:16px/1.5 var(--font);background:radial-gradient(circle at 24% 14%,var(--red-hi),var(--red) 75%) fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body::before{left:calc(24vw - 150vmax);top:calc(14vh - 150vmax);width:300vmax;height:300vmax;background:repeating-conic-gradient(rgba(0,0,0,.1) 0 6deg,transparent 6deg 12deg);animation:spin 160s linear infinite}
body::after{inset:0;background:radial-gradient(circle,rgba(0,0,0,.26) 28%,transparent 31%) 0 0/1.05rem 1.05rem;-webkit-mask:linear-gradient(140deg,transparent 50%,#000 95%);mask:linear-gradient(140deg,transparent 50%,#000 95%)}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
button,input{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:.95;letter-spacing:.01em;margin:0}
p{margin:.6rem 0}
.wrap{max-width:1180px;margin:auto;padding:1.6rem 1.6rem 2.4rem}

/* home: logo and hero */
.brand{display:flex;justify-content:center}
.logo{font-family:var(--display);font-size:2.4rem;line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--white);display:inline-flex;align-items:center;gap:.5rem}
.logo i{width:1.4em;height:1.66em;transform:translateY(-.07em);background:var(--white);-webkit-mask:url("img/panther.png") center/contain no-repeat;mask:url("img/panther.png") center/contain no-repeat}
.hero{max-width:820px;margin:1.4rem auto 2.2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem}
.hero h1{font-size:clamp(3rem,7vw,5.6rem);text-shadow:.3rem .35rem 0 rgba(0,0,0,.35)}
.hero p{margin:0;width:fit-content;padding:.35em .9em .3em;background:var(--black);color:var(--white);font-weight:700;border-radius:.5rem;rotate:-1deg;box-shadow:.25rem .3rem 0 rgba(0,0,0,.35)}
.hero-actions{margin-top:.6rem;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1.2rem}
.btn.hero-start{font-size:2.2rem;rotate:-2deg;box-shadow:.35rem .42rem 0 var(--black)}
.btn.team{font-size:1.9rem;text-decoration:none;rotate:1.5deg}
.script-warning{max-width:730px;margin:16px auto;padding:16px 20px;background:var(--white);color:var(--black);border:var(--outline) solid var(--black);border-radius:.9rem;box-shadow:var(--drop)}
.kicker{display:inline-block;width:fit-content;padding:.35rem .8rem .15rem;background:var(--black);color:var(--white);font-family:var(--display);font-size:1.35rem;line-height:1;letter-spacing:.04em;rotate:-2deg;box-shadow:.25rem .3rem 0 rgba(0,0,0,.35)}
.hero .kicker{font-size:1.6rem;background:var(--white);color:var(--red-hi);border:var(--outline) solid var(--black);border-radius:.5rem;box-shadow:.25rem .3rem 0 var(--black)}
.card{background:var(--white);color:var(--ink);border:var(--outline) solid var(--black);border-radius:.9rem;box-shadow:var(--drop)}

/* the focused lesson view */
.lesson-topbar{max-width:850px;margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.back-button{font-size:1.4rem}
.lesson-top-label{font-family:var(--display);font-size:1.3rem;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.lesson-progress{padding:.3rem .7rem .1rem;border-radius:.5rem;background:var(--black);font-family:var(--display);font-size:1.5rem;line-height:1;white-space:nowrap}
.lesson-main{max-width:850px;margin:0 auto;display:flex;flex-direction:column;gap:1.4rem}

.card{padding:1.4rem 1.6rem 1.6rem}
.card h2{font-size:3rem;margin:.6rem 0 .2rem}
.card > p{color:var(--muted)}

/* buttons: chunky pills that squash when pressed */
.buttons{display:flex;flex-wrap:wrap;gap:.8rem;margin:.4rem 0}
.btn{border:var(--outline) solid var(--black);border-radius:999px;background:var(--white);color:var(--red-hi);padding:.38em 1.3em .22em;font-family:var(--display);font-size:1.6rem;line-height:1;letter-spacing:.02em;box-shadow:.2rem .25rem 0 var(--black);transition:transform .08s,box-shadow .08s,rotate .15s;touch-action:manipulation;text-decoration:none;display:inline-block;cursor:pointer}
.btn:hover:not(:disabled){rotate:-1.5deg}
.btn:active:not(:disabled){transform:translate(.15rem,.2rem);box-shadow:0 0 0 var(--black)}
.btn.primary{background:var(--red-hi);color:var(--white)}
.btn.secondary{background:var(--black);color:var(--white)}
.btn.btn-sm{font-size:1.35rem;padding:.3em .8em .12em}
.btn.btn-xl{font-size:2.1rem;padding:.42em 1.5em .3em;box-shadow:.35rem .42rem 0 var(--black)}
.btn.block{display:block;width:100%;text-align:center}
.btn:disabled{background:#d4d4d4;color:#8a8a8a;box-shadow:.2rem .25rem 0 rgba(0,0,0,.4);cursor:not-allowed}

/* home: the three parts */
.parts{max-width:850px;margin:0 auto 2.4rem;display:flex;flex-direction:column;gap:1.8rem}
.part-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.4rem 1rem;margin-bottom:.4rem}
.part-head h2{font-size:2.6rem;color:var(--black)}
.part-head span{font-size:.85rem;font-weight:700;color:var(--red-hi)}
.part-blurb{color:var(--muted);margin:0 0 .9rem}
.case-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.4rem .8rem;padding:.55rem 0 .45rem;border-top:2px solid #e6e6e6}
.case-row b{font-family:var(--display);font-size:1.6rem;font-weight:400;line-height:1;color:var(--black)}
.case-row b small{display:block;font-family:var(--font);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:.35rem}
.dots button{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;padding:0;border:var(--outline) solid var(--black);border-radius:50%;background:var(--white);color:var(--black);font-family:var(--display);font-size:1.3rem;line-height:1}
.dots button.done{background:var(--black);color:var(--white)}
.dots button.full{background:var(--red-hi);color:var(--white)}
.team-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
.team-card p{margin:0;color:var(--muted)}

/* results */
.report{display:flex;flex-direction:column;gap:.2rem;margin:1rem 0}
.report-row{text-decoration:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.45rem 0 .35rem;border-top:2px solid #e6e6e6;font-family:var(--display);font-size:1.45rem;line-height:1;color:var(--black)}
.report-row b{font-weight:400;color:var(--red-hi)}
.score-big{font-family:var(--display);font-size:4rem;line-height:1;color:var(--red-hi)}
.footer{font-size:.8rem;color:rgba(255,255,255,.85);margin:1.6rem 0;text-align:center}
.lesson-main .st-result h1{font-size:3rem}
.lesson-main .st-model{display:flex;flex-direction:column;gap:.5rem;padding:1rem 1.2rem 1.1rem;border:var(--outline) solid var(--black)}

@media(max-width:780px){
.wrap{padding:1rem .9rem 2rem}
.hero{margin:1rem auto 1.6rem}
.btn.hero-start{font-size:1.9rem}
.lesson-top-label{display:none}
.card{padding:1.1rem 1rem 1.2rem}
.card h2{font-size:2.4rem}
.part-head h2{font-size:2.2rem}
.case-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="home-screen">
    <div class="brand"><div class="logo">Strategy <i></i> Lab</div></div>
    <header class="hero">
      <div class="kicker" id="lesson-kicker"></div>
      <h1 id="lesson-tagline"></h1>
      <p>Work the cases. Take the test. Then take on your team.</p>
      <div class="hero-actions">
        <a class="btn primary hero-start" id="start" href="#learn-1"></a>
        <a class="btn team" href="host.html">Play as a Team ▸</a>
      </div>
    </header>
    <div class="parts" id="parts"></div>
  </div>
  <div id="lesson-screen" hidden>
    <header class="lesson-topbar">
      <a class="btn back-button" href="#home" aria-label="Back to the lesson">← Lesson</a>
      <span class="lesson-top-label" id="lesson-label"></span>
      <span class="lesson-progress" id="lesson-progress"></span>
    </header>
    <main id="main" class="lesson-main"></main>
  </div>
  <noscript><div class="script-warning">This website needs JavaScript to run its interactive lessons. Please enable JavaScript in your browser.</div></noscript>
  <div class="footer">Abstract teaching simulations, not any particular FRC game. Ties are tracked separately.</div>
</div>
<script type="module">
// Everything on this page comes from games/frc-strategy/, the same lessons, scoring and screens the team game uses.
// Links: lessons.html (home), #learn-3 (Learn step 3), #test-3 (Test investigation 3), #learn-done / #test-done
// (your results). Older #lesson-N links open the Test. With more lessons, ?lesson=<id> picks one.
import { html } from './js/ui.js';
import { LESSONS, lessonById, partById } from './games/frc-strategy/lessons.js';
import { bestPoints, cleanAnswer, describeAnswer, scoreAnswer, typeOf } from './games/frc-strategy/quiz.js';
import { answerInputs, answerReview, caseFile, modelCard, promptCard, resultBanner, wireNumber } from './games/frc-strategy/views.js';
import { mountExplorer } from './games/frc-strategy/explorer.js';

const $ = (id) => document.getElementById(id);
const lesson = lessonById(new URLSearchParams(location.search).get('lesson')) ?? LESSONS[0];
const solo = lesson.parts.filter((p) => p.kind === 'quiz'); // the Showdown needs a team
const KEY = 'frc-strategy-solo-v2';
let pending = null; // the answer being edited before it's locked in
let hintOpen = false;

// Your answers, kept in this browser: { [lessonId]: { [partId]: { [question index]: answer } } }
function load() {
  try {
    return JSON.parse(localStorage.getItem(KEY) || '{}')[lesson.id] ?? {};
  } catch {
    return {};
  }
}
const saved = load();
const answersOf = (part) => (saved[part.id] ??= {});
function save() {
  try {
    const all = JSON.parse(localStorage.getItem(KEY) || '{}');
    all[lesson.id] = saved;
    localStorage.setItem(KEY, JSON.stringify(all));
  } catch {
    // Storage may be disabled (private window, embedded preview); the lesson still works.
  }
}

const score = (part) => Object.entries(answersOf(part)).reduce((s, [i, a]) => s + (part.questions[i] ? scoreAnswer(part.questions[i], a) : 0), 0);
const maxScore = (part) => part.questions.reduce((s, q) => s + bestPoints(q), 0);
const done = (part) => part.questions.filter((_, i) => i in answersOf(part)).length;
const nextOpen = (part) => part.questions.findIndex((_, i) => !(i in answersOf(part)));

document.title = `${lesson.title} · FRC Strategy Lab`;
$('lesson-kicker').textContent = `Lesson ${lesson.number} · ${lesson.title}`;
$('lesson-tagline').textContent = lesson.tagline;

// ---------- routing ----------

function route() {
  const legacy = /^#lesson-(\d{1,2})$/.exec(location.hash);
  if (legacy) return location.replace(`#test-${legacy[1]}`);
  if (location.hash === '#done') return location.replace('#test-done');
  const m = /^#(\w+)-(\d{1,2}|done)$/.exec(location.hash);
  const part = m && solo.find((p) => p.id === m[1]);
  const i = part && m[2] !== 'done' ? Number(m[2]) - 1 : -1;
  const inPart = part && (m[2] === 'done' || (i >= 0 && i < part.questions.length));
  $('home-screen').hidden = !!inPart;
  $('lesson-screen').hidden = !inPart;
  pending = null;
  hintOpen = false;
  if (!inPart) showHome();
  else if (m[2] === 'done') showDone(part);
  else showQuestion(part, i);
  window.scrollTo({ top: 0, behavior: 'instant' });
}
addEventListener('hashchange', route);

// ---------- home ----------

function showHome() {
  const learn = solo[0];
  const resume = solo.find((p) => nextOpen(p) >= 0);
  $('start').textContent = !resume ? 'See Your Results ▸' : done(learn) ? `Continue: ${resume.title} ▸` : 'Start Part 1: Learn ▸';
  $('start').href = resume ? `#${resume.id}-${nextOpen(resume) + 1}` : `#${solo.at(-1).id}-done`;
  $('parts').innerHTML = html`${lesson.parts.map((p, n) => (p.kind === 'quiz' ? partCard(p, n) : teamCard(p, n)))}`;
}

function dot(part, i, label) {
  const a = answersOf(part)[i];
  const q = part.questions[i];
  const state = a == null ? '' : scoreAnswer(q, a) === bestPoints(q) ? 'full' : 'done';
  return html`<button type="button" class="${state}" data-go="${part.id}-${i + 1}" title="${q.title}">${label}</button>`;
}

function partCard(part, n) {
  const rows = part.cases
    ? part.cases.map((c, ci) => ({
        title: c.title,
        sub: `Case ${ci + 1}`,
        steps: part.questions.map((q, i) => [q, i]).filter(([q]) => q.caseIndex === ci),
      }))
    : [{ title: 'Investigations', sub: `${part.questions.length} questions`, steps: part.questions.map((q, i) => [q, i]) }];
  return html`
    <section class="card">
      <div class="part-head">
        <h2>Part ${n + 1}: ${part.title}</h2>
        <span>${done(part) ? `${done(part)} / ${part.questions.length} done · ${score(part)} / ${maxScore(part)} pts` : `${part.questions.length} questions`}</span>
      </div>
      <p class="part-blurb">${part.blurb}</p>
      ${rows.map(
        (r) => html`
          <div class="case-row">
            <b><small>${r.sub}</small>${r.title}</b>
            <div class="dots">${r.steps.map(([, i], k) => dot(part, i, part.cases ? k + 1 : i + 1))}</div>
          </div>`,
      )}
      <div class="buttons">
        <a class="btn primary" href="#${part.id}-${nextOpen(part) < 0 ? 'done' : nextOpen(part) + 1}">${nextOpen(part) < 0 ? 'Your Results ▸' : done(part) ? 'Continue ▸' : `Start ${part.title} ▸`}</a>
      </div>
    </section>`;
}

function teamCard(part, n) {
  return html`
    <section class="card team-card">
      <div>
        <div class="part-head"><h2>Part ${n + 1}: ${part.title}</h2></div>
        <p>${part.blurb}</p>
      </div>
      <a class="btn secondary" href="host.html">Open the Big Screen ▸</a>
    </section>`;
}

$('parts').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-go]');
  if (btn) location.hash = btn.dataset.go;
});

// ---------- one question ----------

function showQuestion(part, i) {
  const q = part.questions[i];
  const answer = answersOf(part)[i];
  const locked = answer != null;
  const last = i + 1 >= part.questions.length;
  const label = q.caseTitle != null ? q.section : `Investigation ${i + 1} · ${q.section}`;
  $('lesson-label').textContent = `Strategy Lab / ${part.title}`;
  $('lesson-progress').textContent = `${i + 1} / ${part.questions.length}`;
  $('main').innerHTML = html`
    ${caseFile(q)}
    ${promptCard(q, label)}
    ${locked
      ? html`
        ${resultBanner(q, answer, html`<p>${part.title} score <b>${score(part)}</b> of ${maxScore(part)}</p>`)}
        ${answerReview(q, answer)}
        ${modelCard(q)}
        ${q.explore && html`<div id="explore"></div>`}
        <div class="buttons">
          <a class="btn primary" href="#${part.id}-${last ? 'done' : i + 2}">${last ? `Finish ${part.title} ▸` : q.lastInCase ? 'Next Case ▸' : 'Next ▸'}</a>
          <button type="button" class="btn" data-retry>Try Again</button>
        </div>`
      : html`
        ${answerInputs(q, pending, null, { hintOpen })}
        ${typeOf(q) === 'choice' && html`<button type="button" class="btn btn-xl block" data-submit ${pending == null && 'disabled'}>Lock In &amp; Reveal</button>`}`}`;
  if (locked && q.explore) mountExplorer($('explore'), q.explore);
  if (!locked && typeOf(q) === 'number') wireNumber($('main'), q, (v) => (pending = v));
}

$('main').addEventListener('click', (e) => {
  const m = /^#(\w+)-(\d{1,2}|done)$/.exec(location.hash);
  const part = m && solo.find((p) => p.id === m[1]);
  if (!part) return;
  if (e.target.closest('[data-reset]')) {
    saved[part.id] = {};
    save();
    location.hash = `${part.id}-1`;
    return;
  }
  if (m[2] === 'done') return;
  const i = Number(m[2]) - 1;
  const q = part.questions[i];
  if (e.target.closest('[data-retry]')) {
    delete answersOf(part)[i];
    save();
    pending = null;
    return showQuestion(part, i);
  }
  if (i in answersOf(part)) return;
  if (e.target.closest('[data-hint]')) {
    hintOpen = true;
    return showQuestion(part, i);
  }
  const choice = e.target.closest('[data-choice]');
  if (choice) {
    const k = Number(choice.dataset.choice);
    if (typeOf(q) === 'multi') {
      const picks = new Set(pending ?? []);
      picks.has(k) ? picks.delete(k) : picks.add(k);
      pending = [...picks].sort((a, b) => a - b);
    } else pending = k;
    return showQuestion(part, i);
  }
  if (e.target.closest('[data-submit]')) {
    const fallback = typeOf(q) === 'number' ? (q.number.min + q.number.max) / 2 : typeOf(q) === 'multi' ? [] : null;
    const answer = cleanAnswer(q, pending ?? fallback);
    if (answer == null) return;
    answersOf(part)[i] = answer;
    save();
    pending = null;
    showQuestion(part, i);
  }
});

// ---------- results ----------

function showDone(part) {
  const answers = answersOf(part);
  const full = part.questions.filter((q, i) => i in answers && scoreAnswer(q, answers[i]) === bestPoints(q)).length;
  const after = lesson.parts[lesson.parts.indexOf(part) + 1];
  $('lesson-label').textContent = `Strategy Lab / ${part.title}`;
  $('lesson-progress').textContent = `${done(part)} / ${part.questions.length}`;
  $('main').innerHTML = html`
    <section class="card">
      <div class="kicker">${part.title} complete</div>
      <h2>${lesson.title}</h2>
      <p><span class="score-big">${score(part)}</span> of ${maxScore(part)} points · ${full} of ${part.questions.length} full marks</p>
      <div class="report">
        ${part.questions.map((q, i) => {
          const a = answers[i];
          return html`
            <a class="report-row" href="#${part.id}-${i + 1}">
              <span>${i + 1}. ${q.title}${a != null && html`<small> · ${describeAnswer(q, a)}</small>`}</span>
              <b>${a != null ? `+${scoreAnswer(q, a)} / ${bestPoints(q)}` : 'not answered'}</b>
            </a>`;
        })}
      </div>
      <p>Revisit any question, change the explorer’s assumptions, and test what still holds.</p>
      <div class="buttons">
        ${after &&
        (after.kind === 'quiz'
          ? html`<a class="btn primary" href="#${after.id}-1">On to Part ${lesson.parts.indexOf(after) + 1}: ${after.title} ▸</a>`
          : html`<a class="btn primary" href="host.html">Play the ${after.title} with Your Team ▸</a>`)}
        <button type="button" class="btn" data-reset>Start ${part.title} Over</button>
      </div>
    </section>`;
}

route();
</script>
</body>
</html>
