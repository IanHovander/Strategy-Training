<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRC Strategy Lab</title><style>
:root{--bg:#0b1221;--panel:#16223a;--line:#34455f;--ink:#eff5ff;--muted:#afbed6;--a:#62ded1;--b:#ffbd78}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#263759,transparent 45%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:25px}.brand,.kicker{color:var(--a);font-weight:850;letter-spacing:.13em;font-size:12px}h1{font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-.05em;margin:12px 0}h2{font-size:29px;letter-spacing:-.035em;margin:8px 0}p{color:var(--muted)}.hero{max-width:750px;margin:28px auto 26px;text-align:center}.hero-actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}.hero-start{font-size:15px;padding:12px 24px}.hero-guide{font-size:13px;color:var(--muted);margin-top:10px}.script-warning{max-width:730px;margin:16px auto;padding:16px 20px;background:#3f2f25;border:1px solid #dfae71;border-radius:12px;color:#fff}.brand{text-align:center}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.nav,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}.nav{padding:12px;height:max-content;position:sticky;top:15px}.nav-heading{font-size:12px;letter-spacing:.1em;font-weight:800;color:var(--a);padding:7px 9px 12px}.nav-links{display:grid;grid-template-columns:1fr;gap:2px}.nav button{width:100%;text-align:left;background:none;color:var(--muted);border:0;border-radius:9px;padding:11px}.nav button.active{background:#2b425d;color:white}.nav small{display:block;opacity:.75}.card{padding:24px;margin-bottom:15px}.prompt{padding:16px;background:#23334d;border-left:3px solid var(--a);border-radius:7px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{background:#1d2c45;border:1px solid #53647e;border-radius:12px;color:white;text-align:left;padding:16px}.option.selected{border:2px solid var(--a);padding:15px}.option strong{display:block;font-size:19px}.option small{color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.btn{border:1px solid #536783;background:#2b405e;color:white;border-radius:10px;padding:10px 14px;font-weight:750}.btn.primary{background:var(--a);border-color:var(--a);color:#0a2630}.btn:disabled{opacity:.4}.reveal{background:#16373c;border:1px solid #31736b;border-radius:12px;padding:15px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#20304a;padding:12px;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat b{font-size:23px}.bar{display:flex;height:12px;border-radius:30px;overflow:hidden;background:#65738a;margin:12px 0}.bar span{height:100%}.hint{color:var(--muted);font-size:12px}.control{margin:15px 0}.control label{display:flex;justify-content:space-between}.control input{width:100%;accent-color:var(--a)}.graph{width:100%;height:250px;background:#10192c;border:1px solid var(--line);border-radius:12px}.footer{font-size:12px;color:var(--muted);margin:25px 0}@media(max-width:780px){.wrap{padding:15px}.hero{margin:24px auto 22px}.hero h1{font-size:clamp(31px,9vw,43px)}.hero-actions{margin-top:15px}.layout{grid-template-columns:1fr;gap:12px}.nav{display:block;position:static;padding:12px}.nav-heading{text-align:center;padding:4px 8px 12px;font-size:14px}.nav-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.nav button{min-width:0;padding:11px 9px;min-height:66px;font-size:13px;background:#1d2c45;border:1px solid #34455f}.nav button.active{border-color:var(--a)}.nav small{font-size:10px}.grid{grid-template-columns:1fr}.card{padding:17px}}

/* Keep the lesson experience focused; the full landing page only appears on home. */
[hidden]{display:none!important}
.home-nav{max-width:850px;margin:0 auto 38px;position:static}
.home-nav .nav-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.home-nav .nav-links button{background:#1d2c45;border:1px solid #34455f;min-height:64px}
.home-nav .nav-links button:hover,.home-nav .nav-links button:focus-visible{border-color:var(--a);color:#fff}
.lesson-topbar{max-width:850px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.back-button{padding:9px 12px;font-size:13px;min-height:40px;background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:750}
.back-button:hover,.back-button:focus-visible{border-color:var(--a);background:#21334e}
.lesson-top-label{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--muted)}
.lesson-progress{font-size:12px;color:var(--muted);white-space:nowrap}
.lesson-main{max-width:850px;margin:0 auto}
@media(max-width:780px){.home-nav .nav-links{grid-template-columns:repeat(2,minmax(0,1fr))}.home-nav{margin-bottom:22px}.lesson-topbar{margin-bottom:12px}.lesson-top-label{display:none}.back-button{padding:8px 11px}}

/* Sliders retain native pointer capture while dragged; the lesson rerenders on release only. */
.control input[type="range"]{min-height:32px;touch-action:pan-y;cursor:ew-resize}
.control output{color:var(--a);font-weight:850;font-variant-numeric:tabular-nums}
.simulator{background:#111e32;border:1px solid #496480;border-radius:16px;padding:18px;margin:22px 0 16px}
.simulator-kicker{font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--a);margin-bottom:12px}
.sim-choice-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:12px}
.sim-choice{background:#1c2c45;color:var(--muted);border:1px solid #52657d;border-radius:10px;padding:11px 12px;text-align:left;min-height:62px;transition:background .1s}
.sim-choice strong{display:block;font-size:15px;color:var(--ink)}
.sim-choice small{display:block;font-size:12px;margin-top:2px}
.sim-choice.selected{background:#1b4849;border:2px solid var(--a);padding:10px 11px;color:var(--ink)}
.sim-summary{padding:13px 14px;border-radius:11px;background:#243c50;border-left:4px solid var(--a);display:flex;flex-direction:column;gap:3px}
.sim-summary span{font-size:10px;letter-spacing:.1em;font-weight:900;color:var(--a)}
.sim-summary strong{font-size:16px;line-height:1.35}
.sim-summary small{font-size:12px;color:var(--muted)}
.simulator .buttons{margin:14px 0}
.simulator .hint{line-height:1.6}
@media(max-width:500px){.simulator{padding:13px}.sim-choice{min-height:58px;padding:10px}.sim-summary{padding:12px}}
</style></head><body><div class="wrap">
<div id="home-screen">
<div class="brand">FRC / STRATEGY LAB</div>
<header class="hero"><div class="kicker">MODULE 01 · RISK &amp; CONSISTENCY</div><h1>Winning isn't the same as scoring more.</h1><p>Make predictions. Run matches. Discover the hidden assumptions.</p><div class="hero-actions"><button class="btn primary hero-start" type="button" onclick="go(0)">Start lesson 1 →</button></div></header>
<nav class="nav home-nav" aria-label="Choose a lesson"><div class="nav-heading">CHOOSE A LESSON ↓</div><div class="nav-links" id="nav"><button onclick="go(0)">01 · Fixed opponent</button><button onclick="go(1)">02 · Uncertain opponent</button><button onclick="go(2)">03 · Dependent outcomes</button><button onclick="go(3)">04 · Three-outcome scores</button><button onclick="go(4)">05 · Repeated attempts</button><button onclick="go(5)">06 · Tail risks</button><button onclick="go(6)">07 · Endgame choices</button><button onclick="go(7)">08 · Scouting uncertainty</button><button onclick="go(8)">09 · Opponent adaptation</button><button onclick="go(9)">10 · Mastery challenge</button></div></nav>
</div>
<div id="lesson-screen" hidden>
<header class="lesson-topbar"><button type="button" class="back-button" onclick="showHome()" aria-label="Return to all lessons">← All lessons</button><span class="lesson-top-label">FRC STRATEGY LAB / RISK &amp; CONSISTENCY</span><span class="lesson-progress" id="lesson-progress">1 / 10</span></header>
<main id="main" class="lesson-main"></main>
</div>
<noscript><div class="script-warning">This website requires JavaScript to run its interactive lessons. Please enable JavaScript in your browser.</div></noscript>
</div><script>
const names=['Fixed opponent','Uncertain opponent','Dependent outcomes','Three-outcome scores','Repeated attempts','Tail risks','Endgame choices','Scouting uncertainty','Opponent adaptation','Mastery challenge'];let page=0,choice='',locked=false,simChoice='a',simLabels=[],simSamples=emptySimSamples(),cfg={},progress=loadProgress();function emptySimSamples(){return {a:[],b:[],scenario:[]}}function loadProgress(){try{return JSON.parse(localStorage.getItem('frc-risk-progress')||'{}')}catch(e){return {}}}function saveProgress(){try{localStorage.setItem('frc-risk-progress',JSON.stringify(progress))}catch(e){/* Storage may be disabled in an embedded preview; lessons remain usable. */}}const $=id=>document.getElementById(id),pct=x=>(100*x).toFixed(1)+'%',avg=d=>d.reduce((s,[v,p])=>s+v*p,0),pick=d=>{let r=Math.random();for(const [v,p] of d){r-=p;if(r<0)return v}return d.at(-1)[0]},win=(a,b)=>a.reduce((s,[v,p])=>s+p*b.reduce((t,[w,q])=>t+(v>w?q:0),0),0);function nav(){$('nav').innerHTML=names.map((n,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${progress[i]?'✓':String(i+1).padStart(2,'0')} · ${n}<small>${i<5?'Probability foundations':i<8?'Applications':'Advanced'}</small></button>`).join('')}function go(i){if(i<0||i>=names.length)return;let hash='#lesson-'+(i+1);if(location.hash===hash)route();else location.hash=hash}
function showHome(){if(location.hash==='#home')route();else location.hash='home'}
function route(){let m=/^#lesson-(\d{1,2})$/.exec(location.hash);let i=m?Number(m[1])-1:-1;let inLesson=i>=0&&i<names.length;$('home-screen').hidden=inLesson;$('lesson-screen').hidden=!inLesson;if(inLesson){page=i;choice='';locked=false;simChoice='a';simLabels=[];simSamples=emptySimSamples();cfg={};$('lesson-progress').textContent=(i+1)+' / '+names.length;render()}else nav();window.scrollTo({top:0,behavior:'instant'})}function box(question,body){return `<section class="card"><div class="kicker">INVESTIGATION ${page+1} / 10</div><h2>${names[page]}</h2><div class="prompt">${question}</div>${body}</section>`}function opts(a,b){return `<div class="grid"><button class="option ${choice==='a'?'selected':''}" onclick="choose('a')"><small>OPTION A</small><strong>${a}</strong></button><button class="option ${choice==='b'?'selected':''}" onclick="choose('b')"><small>OPTION B</small><strong>${b}</strong></button></div>`}function choose(c){if(!locked){choice=c;render()}}function commit(){if(!choice)return;locked=true;simChoice=choice;render()}function button(){return `<div class="buttons"><button class="btn primary" ${choice?'':'disabled'} onclick="commit()">Lock prediction & reveal</button></div>`}function next(){return `<div class="buttons"><button class="btn primary" onclick="advance()">${page===9?'Finish branch':'Next investigation →'}</button></div>`}function advance(){progress[page]=true;saveProgress();if(page<9)go(page+1);else{$('main').innerHTML=box('Branch complete','<h3>Now challenge the model itself.</h3><p>Revisit any investigation, change assumptions, and test what still holds.</p><button class="btn primary" onclick="go(0)">Restart</button>');nav()}}function reveal(t){return `<div class="reveal"><b>What the model says</b><p>${t}</p></div>`}function slider(id,label,min,max,initial,step=1){return `<div class="control"><label for="slider-${id}">${label}<output id="slider-output-${id}" for="slider-${id}">${cfg[id]??initial}</output></label><input id="slider-${id}" aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${cfg[id]??initial}" oninput="document.getElementById('slider-output-${id}').textContent=this.value" onchange="updateSlider('${id}',this.value)"></div>`}
function updateSlider(id,value){let updated=Number(value);if(cfg[id]===updated)return;cfg[id]=updated;simSamples=emptySimSamples();render()}
function choiceSimulation(){return page===0||page===1||page===3||page===5}
function activeSamples(){return simSamples[choiceSimulation()?simChoice:'scenario']}
function sim(){let picker='';if(choiceSimulation()){
 picker=`<div class="sim-choice-buttons" role="group" aria-label="Choose strategy to simulate">${['a','b'].map(c=>`<button type="button" class="sim-choice ${simChoice===c?'selected':''}" aria-pressed="${simChoice===c}" onclick="setSimChoice('${c}')"><strong>Option ${c.toUpperCase()}</strong><small id="sim-count-${c}">${simSamples[c].length.toLocaleString()} matches run</small></button>`).join('')}</div><div class="sim-summary" aria-live="polite"><span>NOW SIMULATING</span><strong>Robot A · Option ${simChoice.toUpperCase()}: ${simLabels[simChoice==='a'?0:1]}</strong><small>Against Robot B. Your original prediction was Option ${choice.toUpperCase()}; you can test either strategy without changing it.</small></div>`;
 }else if(page===2){picker=`<div class="sim-summary"><span>NOW SIMULATING</span><strong>${cfg.dep?'Opposite outcomes':'Together outcomes'}</strong><small>Robot A scores 5 or 15; Robot B scores 8 or 18. Change the relationship above to compare cases.</small></div>`;
 }else if(page===4){picker=`<div class="sim-summary"><span>NOW SIMULATING</span><strong>Robot A: 70% per shot · Robot B: 50% per shot</strong><small>${cfg.n??10} independent attempts each. Change the slider to run a new scenario.</small></div>`}
 return `<section class="simulator" id="simulation-panel"><div class="simulator-kicker">MATCH SIMULATOR</div>${picker}<div class="buttons"><button class="btn primary" onclick="run(1)">Run 1</button><button class="btn" onclick="run(10)">Run 10</button><button class="btn" onclick="run(1000)">Run 1,000</button><button class="btn" onclick="clearActiveSamples()">Clear results</button></div><div id="samples"></div></section>`}
function setSimChoice(c){if(!choiceSimulation()||!['a','b'].includes(c))return;simChoice=c;let panel=$('simulation-panel');if(panel){panel.outerHTML=sim();show()}}
function setDependency(d){if(Number(Boolean(cfg.dep))===d)return;cfg.dep=d;simSamples=emptySimSamples();render()}
function clearActiveSamples(){if(choiceSimulation())simSamples[simChoice]=[];else simSamples.scenario=[];show()}
function run(n){let list=activeSamples();for(let i=0;i<n;i++)list.push(match());if(list.length>10000)list.splice(0,list.length-10000);show()}
function show(){let list=activeSamples(),n=list.length,w=list.filter(s=>s[0]>s[1]).length,t=list.filter(s=>s[0]===s[1]).length,l=n-w-t;let samplesElement=$('samples');if(!samplesElement)return;samplesElement.innerHTML=`<div class="stats"><div class="stat"><small>Robot A wins</small><b style="color:var(--a)">${n?pct(w/n):'—'}</b></div><div class="stat"><small>Ties</small><b>${n?pct(t/n):'—'}</b></div><div class="stat"><small>Robot B wins</small><b style="color:var(--b)">${n?pct(l/n):'—'}</b></div></div><div class="bar"><span style="width:${n?100*w/n:0}%;background:var(--a)"></span><span style="width:${n?100*t/n:0}%;background:#8191ab"></span><span style="width:${n?100*l/n:0}%;background:var(--b)"></span></div><div class="hint">${n.toLocaleString()} matches ${choiceSimulation()?'with Option '+simChoice.toUpperCase():'in this scenario'}${n?' · Latest: Robot A '+list.at(-1)[0]+' – Robot B '+list.at(-1)[1]:''}</div>`;if(choiceSimulation())for(const c of ['a','b']){let counter=$('sim-count-'+c);if(counter)counter.textContent=simSamples[c].length.toLocaleString()+' matches run'}}
function dist(){if(page===0)return {a:[[11,1]],b:[[0,.6],[20,.4]],o:[[cfg.target??12,1]]};if(page===1)return {a:[[11,1]],b:[[0,.6],[20,.4]],o:[[8,(cfg.low??50)/100],[16,1-(cfg.low??50)/100]]};if(page===3)return {a:[[0,.2],[10,.5],[20,.3]],b:[[5,.5],[17,.5]],o:[[0,.1],[10,.5],[20,.4]]};if(page===5)return {a:[[10,1]],b:[[0,.1],[10,.8],[20,.1]],o:[[9,1]]};return {a:[[11,1]],b:[[0,.6],[20,.4]],o:[[12,1]]}}function match(){if(page===2){let h=Math.random()<.5;return cfg.dep?(h?[15,8]:[5,18]):(h?[15,18]:[5,8])}if(page===4){let a=0,b=0;for(let i=0;i<(cfg.n??10);i++){a+=Math.random()<.7?1:0;b+=Math.random()<.5?1:0}return[a,b]}let d=dist();return[pick(simChoice==='a'?d.a:d.b),pick(d.o)]}function standard(q,labels,explain,controls=''){simLabels=labels;let d=dist();return box(q,controls+opts(...labels)+(locked?reveal(`Option A wins <b>${pct(win(d.a,d.o))}</b>; option B wins <b>${pct(win(d.b,d.o))}</b>. Their expected scores are ${avg(d.a).toFixed(1)} and ${avg(d.b).toFixed(1)}. ${explain}`)+sim()+next():button()))}function binom(n,p){let d=[];for(let k=0;k<=n;k++){let c=1;for(let j=1;j<=k;j++)c*=((n-j+1)/j);d.push([k,c*p**k*(1-p)**(n-k)])}return d}
function render(){nav();let h='';if(page===0)h=standard('Robot B always scores <b>12</b>. Robot A can score 11 for certain, or gamble for 20. Which choice maximizes win probability?',['11 points, guaranteed','20 points (40%), 0 otherwise'],'A lower expected score can still have a higher win probability. Change B’s score to reverse the decision.',slider('target','B fixed score',8,18,12));
if(page===1)h=standard('Now B scores <b>8 or 16</b>. Both robots have uncertain scores. Which A strategy wins more often?',['11 points, guaranteed','20 (40%), 0 (60%)'],'We multiplied independent probabilities. What if A and B outcomes are linked?',slider('low','B scores 8 (% of matches)',0,100,50,5));
if(page===2)h=box('A scores 5 or 15; B scores 8 or 18. Both are high exactly half the time. Does knowing each robot’s distribution determine the winner?',`<p>Choose the relationship between the robots’ outcomes.</p><div class="grid"><button class="option ${!cfg.dep?'selected':''}" onclick="setDependency(0)">Together: (15,18) or (5,8)</button><button class="option ${cfg.dep?'selected':''}" onclick="setDependency(1)">Opposite: (15,8) or (5,18)</button></div>${reveal(cfg.dep?'A wins 50% of matches, even though neither robot’s individual distribution changed.':'A wins 0% of matches because B always scores three more.')}<p>Discussion: How might field congestion, game-piece supply, or defense create shared randomness?</p>${sim()}${next()}`);
if(page===3)h=standard('Two A strategies both average 11 points. B scores 0 (10%), 10 (50%), or 20 (40%). Which A strategy wins more often?',['0 (20%), 10 (50%), 20 (30%)','5 (50%), 17 (50%)'],'Same average, different chance of exceeding the opponent. Work through the outcome pairs.');
if(page===4){let n=cfg.n??10,a=binom(n,.7),b=binom(n,.5);h=box('A succeeds on 70% of shots and B on 50%. Both have the same number of independent attempts. How does the number of attempts change the win probability?',`${slider('n','Shots per robot',1,30,10)}<div class="stats"><div class="stat"><small>A mean score</small><b>${(n*.7).toFixed(1)}</b></div><div class="stat"><small>B mean score</small><b>${(n*.5).toFixed(1)}</b></div><div class="stat"><small>A exact win chance</small><b>${pct(win(a,b))}</b></div></div><p>Predict the change before moving the slider. More attempts often make the persistent accuracy advantage clearer, although ties and discreteness matter.</p>${sim()}${next()}`)}
if(page===5)h=standard('B always scores 9. A can score 10 guaranteed, or choose a strategy that scores 0 (10%), 10 (80%), or 20 (10%). Both A strategies have the same mean. Which wins more often?',['10 points guaranteed','0 / 10 / 20 with 10 / 80 / 10%'],'The risky strategy has a catastrophic lower tail, even though it sometimes scores 20. Mean alone misses this asymmetry.');
if(page===6){let need=cfg.need??9;let safe=need<10?1:0,risky=need<15?.55:0;h=box('Thirty seconds remain. Robot A needs to score <b>more than</b> the remaining deficit. It can take two reliable 5-point cycles (10 total), or one 15-point attempt with a 55% success chance.',`${slider('need','Points A must exceed to win',3,17,9)}<div class="grid"><button class="option ${choice==='a'?'selected':''}" onclick="choose('a')"><strong>Reliable: +10</strong></button><button class="option ${choice==='b'?'selected':''}" onclick="choose('b')"><strong>Risky: +15 (55%)</strong></button></div>${locked?reveal(`Reliable wins ${pct(safe)}; risky wins ${pct(risky)}. The optimal risk changes with the score deficit. The model assumes B scores no additional points.`)+next():button()}`)}
if(page===7){let s=cfg.success??7,n=cfg.trials??10,prior=1,post=(s+prior)/(n+2*prior);h=box('Scouting reports that a maneuver succeeded <b>7 times in 10 attempts</b>. Should you treat its true success probability as exactly 70%?',`${slider('success','Observed successes',0,10,7)}<div class="stats"><div class="stat"><small>Observed success rate</small><b>${pct(s/n)}</b></div><div class="stat"><small>Bayesian posterior mean</small><b>${pct(post)}</b></div><div class="stat"><small>Sample size</small><b>${n}</b></div></div><p>For the second number, we use a uniform Beta(1,1) prior, yielding Beta(${s+1},${n-s+1}) after observing these attempts. This is one explicit assumption, not an objective correction.</p><div class="reveal"><b>Try this thought experiment</b><p>If the same rate came from 70 successes in 100 attempts, should you have the same confidence? What if the attempts were all against weak defense?</p></div>${next()}`)}
if(page===8){let defend=cfg.defend??50,offense=.7*(1-defend/100),safe=.4;h=box('Robot A can use a reliable plan or a risky maneuver. Robot B can defend the maneuver, reducing its success rate. B chooses its own strategy based on what it expects A to do.',`${slider('defend','Defense reduction in risky success (%)',0,100,50,5)}<div class="stats"><div class="stat"><small>Safe vs. defense</small><b>${pct(safe)}</b></div><div class="stat"><small>Risky vs. offense</small><b>70%</b></div><div class="stat"><small>Risky vs. defense</small><b>${pct(offense)}</b></div></div><p>These win probabilities are a deliberately simplified payoff model. Which action would B choose if it knew A’s plan? How could A benefit from being unpredictable?</p>${reveal('A strategy that dominates against an unchanging opponent can be exploited by an adapting opponent. Uncertainty about intentions becomes strategically important.')}${next()}`)}
if(page===9){let x=cfg.eff??40,defense=.3+.007*x,offense=.52;h=box('Final challenge: An offensive plan wins 52% of matches. A defensive plan’s win rate depends on how effective defense truly is. Scouting suggests 40% effectiveness, but the estimate is uncertain.',`${slider('eff','Assumed defensive effectiveness (%)',0,70,40,5)}<div class="stats"><div class="stat"><small>Offense win chance</small><b>${pct(offense)}</b></div><div class="stat"><small>Defense win chance</small><b>${pct(defense)}</b></div><div class="stat"><small>Difference</small><b>${(100*(defense-offense)).toFixed(1)} pts</b></div></div><p>Which assumption values reverse your decision? How would you estimate them? Is more scouting worth its cost? Can the opponent change the effectiveness of your defense?</p><div class="reveal"><b>Mastery reflection</b><p>Write down your strategy, confidence, the most important assumption, and the cheapest observation that could change your choice. These are the foundations of real match strategy.</p></div>${next()}`)}
$('main').innerHTML=h;if($('samples'))show()}
window.addEventListener('hashchange',route);route();
</script></body></html>
